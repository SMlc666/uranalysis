[workspace]
members = [
    "crates/urdisassembly",
    "crates/ura-core",
    "crates/ura-cli",
    "crates/ura-daemon",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
goblin = "0.8"
capstone = "0.12"
urdisassembly = { path = "crates/urdisassembly" }
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
