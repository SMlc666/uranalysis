[workspace]
members = [
    "crates/urdisassembly",
    "crates/urdis2il",
    "crates/ura-core",
    "crates/ura-cli",
    "crates/ura-daemon",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
goblin = "0.8"
urdisassembly = { path = "crates/urdisassembly" }
urdis2il = { path = "crates/urdis2il" }
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
